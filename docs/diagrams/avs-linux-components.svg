<text x="1264" y="574" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">avs-api</text>
<text x="1264" y="619" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Authentication + authorization</text>
<text x="1264" y="649" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Inventory, reviews and reports</text>
<rect x="540" y="800" width="570" height="180" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="564" y="844" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">avs-worker</text>
<text x="564" y="889" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Source ingest; evaluate; export</text>
<text x="564" y="919" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Durable jobs and schedule leases</text>
<rect x="1240" y="800" width="570" height="180" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="1264" y="844" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">PostgreSQL container</text>
<text x="1264" y="889" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Records, revisions, jobs and audit</text>
<text x="1264" y="919" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Private DB network; no host port</text>
<rect x="540" y="1090" width="570" height="180" rx="14" fill="#FFF8E8" stroke="#BACADD" stroke-width="2"/>
<text x="564" y="1134" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">avs-collector  ·  optional</text>
<text x="564" y="1179" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Approved read operations only</text>
<text x="564" y="1209" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Only app service with ADC secrets</text>
<rect x="1240" y="1090" width="570" height="180" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="1264" y="1134" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Host maintenance  (host)</text>
<text x="1264" y="1179" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Coordinated backup and restore</text>
<text x="1264" y="1209" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Controlled migrations and updates</text>
<rect x="1950" y="435" width="390" height="885" rx="14" fill="#EFF6FE" stroke="#89B3D7" stroke-width="2"/>
<text x="1975" y="480" fill="#0078D4" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">PERSISTENT HOST DATA</text>
