<circle cx="1300" cy="1025" r="20" fill="#0078D4"/>
<text x="1293" y="1033" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">4</text>
<polyline points="2145,1270 2145,1300 820,1300 820,1270" fill="none" stroke="#0078D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<rect x="60" y="1370" width="2280" height="250" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="86" y="1412" fill="#0078D4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">BOUNDARIES &amp; NUMBERED FLOWS</text>
<text x="90" y="1454" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">1  Browser HTTPS.  2  Private API proxy.  3  Worker fetch/import.  4  Private DB access.  5  Authorized evidence reads.  6  ADC reads.</text>
<text x="90" y="1498" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Worker also writes finalized evidence; maintenance reads the coordinated DB + artifact set and sends encrypted backups off host.</text>
<text x="90" y="1542" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Only the collector mounts ADC credentials. API stores opaque credential references. No container receives the Docker socket.</text>
<text x="90" y="1586" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Networks and firewall policy enforce allowed paths; this is a logical component view, not a packet-level cabling diagram.</text>
<text x="60" y="1663" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">INITIAL BASELINE  ·  Local file secrets + authenticated, audited approvals  ·  Cryptographic approval signing is a later option</text>
</svg>