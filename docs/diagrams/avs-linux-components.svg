<text x="2004" y="574" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Evidence files</text>
<text x="2004" y="619" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">/var/lib/avs/evidence</text>
<text x="2004" y="649" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Finalized artifacts + digests</text>
<rect x="1980" y="800" width="330" height="180" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="2004" y="844" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">PostgreSQL data</text>
<text x="2004" y="889" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Dedicated local volume</text>
<text x="2004" y="919" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Not Azure Database for</text>
<text x="2004" y="949" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">PostgreSQL</text>
<rect x="1980" y="1090" width="330" height="180" rx="14" fill="#FFF8E8" stroke="#BACADD" stroke-width="2"/>
<text x="2004" y="1134" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Secret files</text>
<text x="2004" y="1179" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">/etc/avs/secrets</text>
<text x="2004" y="1209" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Restricted read-only mounts</text>
<text x="2004" y="1239" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Vault integration later</text>
