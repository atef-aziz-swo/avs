<text x="564" y="574" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">avs-web</text>
<text x="564" y="619" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">NGINX + static React interface</text>
<text x="564" y="649" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">TLS termination; /api proxy only</text>
