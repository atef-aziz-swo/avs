<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1700" viewBox="0 0 2400 1700" role="img"><title>AVS Linux VM and container boundaries</title><desc>Linux Docker Compose runtime, credential boundary, PostgreSQL storage and evidence flows; usable locally or on an Azure VM.</desc>
<rect width="2400" height="1700" fill="#F4F7FB"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#0078D4"/></marker></defs>
<text x="60" y="68" fill="#0078D4" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">AVS  /  TECHNICAL ARCHITECTURE</text>
<text x="60" y="121" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="600">Linux VM and container boundaries</text>
<text x="60" y="162" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Same runtime on premises or in Azure  |  Local PostgreSQL, evidence and secrets  |  No public database endpoint</text>
<rect x="60" y="205" width="2280" height="190" rx="14" fill="#EAF2FB" stroke="#98BADE" stroke-width="2"/>
<image x="90" y="236" width="75" height="75" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/svg+xml;base64,"/>
<text x="190" y="254" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">HOST BOUNDARY  /  dedicated Linux VM</text>
<text x="190" y="299" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400">Internal HTTPS endpoint; restricted host administration; encrypted persistent storage</text>
<text x="190" y="343" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">Azure placement: private NIC + NSG + managed data disk. Local placement: equivalent site network and disk controls.</text>
<rect x="60" y="465" width="365" height="180" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="84" y="509" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Internal browser</text>
<text x="84" y="554" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Operator / reviewer</text>
<text x="84" y="584" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Only published app port: 443</text>
<rect x="60" y="770" width="365" height="185" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="84" y="814" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Vendor sources</text>
<text x="84" y="859" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Allowlisted HTTPS / proxy</text>
<text x="84" y="889" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Or reviewed offline import</text>
<rect x="60" y="1080" width="365" height="190" rx="14" fill="white" stroke="#BACADD" stroke-width="2"/>
<text x="84" y="1124" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">NetScaler 14.1</text>
<text x="84" y="1169" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Management API only</text>
<text x="84" y="1199" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Verified TLS; restricted reads</text>
<text x="84" y="1229" fill="#52657C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400">Discovery is separately gated</text>
<rect x="490" y="435" width="1390" height="885" rx="14" fill="#FFFFFF" stroke="#89B3D7" stroke-width="2"/>
<text x="520" y="480" fill="#0078D4" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">APPLICATION RUNTIME  /  containers + host maintenance</text>
